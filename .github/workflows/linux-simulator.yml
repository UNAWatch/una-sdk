name: Linux Simulator (non-gating)

on:
  pull_request:
    paths:
      - 'Libs/**'
      - 'ThirdParty/**'
      - 'cmake/**'
      - 'Examples/Apps/**'
      - 'Docs/Tutorials/**'
      - 'Tests/Host/simulator/GlanceHost_test.cpp'
      - '.github/workflows/linux-simulator.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'Libs/**'
      - 'ThirdParty/**'
      - 'cmake/**'
      - 'Examples/Apps/**'
      - 'Docs/Tutorials/**'
      - 'Tests/Host/simulator/GlanceHost_test.cpp'
      - '.github/workflows/linux-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      projects: ${{ steps.pick.outputs.projects }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0            # PR change-detection diffs against the base
          persist-credentials: false

      - name: Select projects to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # Two kinds of simulator project, each printed as "<dir> <kind>":
          #   make   a TouchGFX GUI, built by simulator/gcc/Makefile
          #   cmake  an LVGL GUI or glance, built by simulator/CMakeLists.txt
          find_projects() {
            {
              find Examples/Apps Docs/Tutorials -path '*/simulator/gcc/Makefile' 2>/dev/null \
                | sed 's#/simulator/gcc/Makefile# make#'
              find Examples/Apps Docs/Tutorials -path '*/simulator/CMakeLists.txt' 2>/dev/null \
                | sed 's#/simulator/CMakeLists.txt# cmake#'
            } | sort
          }
          TOTAL="$(find_projects | wc -l | tr -d ' ')"
          echo "Discovered $TOTAL simulator project(s)."

          # push / dispatch build everything; a PR builds only the projects it
          # touches, or everything when it touches shared inputs.
          BUILD_ALL=false
          case "$EVENT" in
            push|workflow_dispatch) BUILD_ALL=true ;;
          esac

          CHANGED=""
          if [ "$EVENT" = "pull_request" ]; then
            # Ensure the base commit is present, then diff the PR against it.
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
            if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              CHANGED="$(git diff --name-only "${BASE_SHA}...HEAD")" || CHANGED=""
            fi

            if [ -z "$CHANGED" ]; then
              # Empty on a real PR means detection failed (unresolved base), not
              # "nothing to build" -- fail safe to a full build rather than skip.
              echo "::warning::Could not determine changed files for base ${BASE_SHA}; building all projects."
              BUILD_ALL=true
            elif printf '%s\n' "$CHANGED" | grep -qE '^(Libs/|ThirdParty/|cmake/|Tests/Host/simulator/GlanceHost_test\.cpp|\.github/workflows/linux-simulator\.yml)'; then
              BUILD_ALL=true
            fi
          fi

          SEL='[]'
          while IFS=' ' read -r d kind; do
            [ -n "$d" ] || continue
            name="$(printf '%s' "$d" | cut -d/ -f3)"     # Examples/Apps/<name> or Docs/Tutorials/<name>
            root="$(printf '%s' "$d" | cut -d/ -f1-3)"   # app/tutorial root (covers its Libs/Sources)
            take=false
            if $BUILD_ALL; then
              take=true
            elif printf '%s\n' "$CHANGED" | grep -q "^${root}/"; then
              take=true
            fi
            if $take; then
              # Every project builds 64-bit. An LVGL app also builds 32-bit, like
              # the watch: its LVGL pool is then exactly the watch's, so an app
              # that would run out of memory on the watch fails here (exit 4).
              archs="x64"
              case "$d" in */LVGL-GUI) archs="x64 x86" ;; esac
              for arch in $archs; do
                slug="$(printf '%s' "$d" | tr '/' '-')-$arch"   # unique artifact key (leaf names can collide)
                SEL="$(printf '%s' "$SEL" \
                  | jq -c --arg n "$name" --arg d "$d" --arg s "$slug" --arg k "$kind" --arg a "$arch" \
                       '. + [{name:$n, dir:$d, slug:$s, kind:$k, arch:$a}]')"
              done
            fi
          done < <(find_projects)

          echo "projects=$SEL" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$SEL" | jq 'length')" >> "$GITHUB_OUTPUT"
          {
            echo "### Linux Simulator — selection"
            echo ""
            echo "- event: \`$EVENT\`  | build-all: \`$BUILD_ALL\`"
            echo "- selected $(printf '%s' "$SEL" | jq 'length') of $TOTAL project(s):"
            printf '%s' "$SEL" | jq -r '.[] | "  - `" + .dir + "` (" + .kind + ", " + .arch + ")"'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    name: build (${{ matrix.project.name }}, ${{ matrix.project.kind }}, ${{ matrix.project.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    env:
      APP_DIR: ${{ matrix.project.dir }}
      KIND: ${{ matrix.project.kind }}
      ARCH: ${{ matrix.project.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The LVGL simulators build LVGL from the submodule (ThirdParty/lvgl,
          # shallow per .gitmodules).
          submodules: ${{ matrix.project.kind == 'cmake' }}

      - name: Install simulator build dependencies
        run: |
          if [ "$ARCH" = x86 ]; then
            # 32-bit: the multilib compilers and the i386 SDL2. A mirror can
            # briefly serve i386 package lists out of step with amd64 ones
            # ("unmet dependencies"), so retry with fresh lists.
            # libglib2.0-dev:i386 (pulled in by the i386 SDL2) needs the glib
            # tools at its own version, which only the amd64 packages can
            # supply alongside the runner's amd64 glib. Naming them lets apt
            # upgrade the runner's copies to match rather than give up.
            sudo dpkg --add-architecture i386
            for attempt in 1 2 3; do
              sudo apt-get update
              if sudo apt-get install -y --no-install-recommends \
                   gcc-multilib g++-multilib libsdl2-dev:i386 ninja-build \
                   libglib2.0-bin libglib2.0-dev-bin; then
                break
              fi
              apt-cache policy libglib2.0-0t64 libglib2.0-bin libglib2.0-dev-bin libglib2.0-dev:i386
              dpkg -l '*glib2.0*' | grep '^ii' || true
              [ "$attempt" -lt 3 ] || exit 1
              echo "::warning::apt-get install failed (attempt $attempt); retrying in 60 s"
              sleep 60
            done
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libsdl2-dev libsdl2-image-dev libjpeg-dev ruby ruby-nokogiri ninja-build
          fi

      - name: Build simulator
        id: build
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR"
          export UNA_SDK="$GITHUB_WORKSPACE"
          if [ "$KIND" = cmake ]; then
            # Configure in a scratch dir; the project places its binary in
            # simulator/build/bin whatever the build dir, so the mock file
            # system path resolves the same as for a developer's build.
            FLAGS=()
            if [ "$ARCH" = x86 ]; then
              FLAGS=(-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32)
            fi
            { cmake -S simulator -B simulator/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug "${FLAGS[@]}" \
                && cmake --build simulator/build-ci -j"$(nproc)"; } 2>&1 \
              | tee "$GITHUB_WORKSPACE/build.log"
          else
            make -f simulator/gcc/Makefile -j"$(nproc)" 2>&1 \
              | tee "$GITHUB_WORKSPACE/build.log"
          fi

      - name: Headless smoke run
        id: smoke
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          cd "$APP_DIR"
          if [ "$KIND" = cmake ] && [ -f simulator/build-ci/CTestTestfile.cmake ]; then
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
              ctest --test-dir simulator/build-ci --output-on-failure 2>&1 \
              | tee "$GITHUB_WORKSPACE/sim.log"
            exit "${PIPESTATUS[0]}"
          fi
          if [ "$KIND" = cmake ]; then
            BIN_DIR=simulator/build/bin
            EXE="$(find "$BIN_DIR" -maxdepth 1 -type f -perm -u+x | head -n 1)"
            EXE="./$(basename "$EXE")"
          else
            BIN_DIR=build/bin
            EXE=./simulator.out
          fi
          # A scripted headless run (SDK/Simulator/Automation). The project's own
          # simulator/smoke.txt if it has one, else: boot, take a screenshot,
          # exit. Either takes a screenshot named "boot". The run must end on
          # its own with exit code 0; timeout only catches a hang. Run from the
          # binary's directory, where the mock file system lands.
          SCRIPT="$PWD/simulator/smoke.txt"
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT="$RUNNER_TEMP/smoke.txt"
            printf '3000 screenshot boot\n3500 exit\n' > "$SCRIPT"
          fi
          cd "$BIN_DIR"
          set +e
          SDL_AUDIODRIVER=dummy timeout 60 "$EXE" --headless --script "$SCRIPT" \
            --out "$GITHUB_WORKSPACE/sim-out" > "$GITHUB_WORKSPACE/sim.log" 2>&1
          code=$?
          echo "exit=$code"
          echo "----- first 30 lines of sim.log -----"; head -30 "$GITHUB_WORKSPACE/sim.log" || true
          grep "LVGL pool\|OUT OF MEMORY" "$GITHUB_WORKSPACE/sim.log" || true
          [ "$code" -ne 4 ] || { echo "OUT OF MEMORY: the app ran out of LVGL pool ($ARCH build)"; exit 1; }
          [ "$code" -eq 0 ] || { echo "RUN FAILED: exit code $code"; exit 1; }
          # The service logs this on COMMAND_APP_NOTIF_GUI_RUN, in every app.
          grep -q "GUI is now running" "$GITHUB_WORKSPACE/sim.log" \
            || { echo "BOOT FAILED: marker not found"; exit 1; }
          [ -s "$GITHUB_WORKSPACE/sim-out/boot.png" ] \
            || { echo "SCREENSHOT FAILED: sim-out/boot.png missing"; exit 1; }
          echo "BOOT OK"

      - name: Write PASS/FAIL summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PROJECT_NAME: ${{ matrix.project.name }}
        run: |
          b="$BUILD_OUTCOME"; s="$SMOKE_OUTCOME"
          icon() { [ "$1" = success ] && echo '✅' || { [ "$1" = skipped ] && echo '⏭️' || echo '❌'; }; }
          {
            echo "### $PROJECT_NAME ($KIND, $ARCH) — _(informational, non-gating)_"
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| Build | $(icon "$b") \`$b\` |"
            echo "| Headless boot | $(icon "$s") \`$s\` |"
            echo ""
            echo "\`$APP_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-sim-${{ matrix.project.slug }}
          path: |
            build.log
            sim.log
            sim-out/
            ${{ matrix.project.dir }}/build/bin/simulator.out
            ${{ matrix.project.dir }}/simulator/build/bin/*
          if-no-files-found: ignore
          retention-days: 14
